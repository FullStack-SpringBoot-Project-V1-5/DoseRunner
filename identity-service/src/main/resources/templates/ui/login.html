<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{ui/fragments :: head('Log in')}"></head>
<body>
<header th:replace="~{ui/fragments :: nav(null)}"></header>
<main>
    <div class="card narrow">
        <h1>Log in</h1>
        <p class="flash error" th:if="${param.error}">Invalid username or password.</p>
        <p class="flash success" th:if="${param.logout}">You have been logged out.</p>
        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" autofocus required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Log in</button>
        </form>
    </div>
</main>
</body>
</html>
