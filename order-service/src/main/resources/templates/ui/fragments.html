<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · DoseRunner'">DoseRunner</title>
    <link rel="stylesheet" th:href="@{/css/doserunner.css}">
</head>
<body>
<header th:fragment="nav" class="topbar">
    <a class="brand" th:href="@{/ui/orders/new}">DoseRunner</a>
    <nav>
        <a th:href="@{/ui/orders/new}">New order</a>
        <a th:href="@{/ui/pharmacy/queue}">Validation queue</a>
    </nav>
</header>
<div th:fragment="flash">
    <p class="flash success" th:if="${message}" th:text="${message}">Saved.</p>
    <p class="flash error" th:if="${error}" th:text="${error}">Something went wrong.</p>
</div>
</body>
</html>
