spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${SPRING_DATASOURCE_USERNAME:orders}
    password: ${SPRING_DATASOURCE_PASSWORD:orders}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  artemis:
    mode: native
    broker-url: ${SPRING_ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${SPRING_ARTEMIS_USER:artemis}
    password: ${SPRING_ARTEMIS_PASSWORD:artemis}
  thymeleaf:
    cache: true

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

doserunner:
  order:
    actor:
      user-header-enabled: true
      demo-nurse-id: u-nurse-demo
      demo-pharmacist-id: u-pharmacist-demo
    formulary-cache:
      maximum-size: 500
      time-to-live: 10m
