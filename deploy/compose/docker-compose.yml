# DoseRunner — local dev stack (no Kubernetes, no Istio: those arrive in week 3).
#
#   docker compose -f deploy/compose/docker-compose.yml up --build
#
# Credentials below are DEV DEFAULTS. Override them through environment variables / a local .env (gitignored).

name: doserunner

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: prod            # JSON logs (commons/logback-spring.xml)
  SPRING_ARTEMIS_MODE: native
  SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616
  SPRING_ARTEMIS_USER: ${ARTEMIS_USER:-artemis}
  SPRING_ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-artemis}

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    artemis:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl -fs http://localhost:$${SERVER_PORT}/actuator/health/readiness || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 20s

services:
  postgres:
    image: postgres:16.16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  artemis:
    image: apache/activemq-artemis:2.44.0
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER:-artemis}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:-artemis}
      ANONYMOUS_LOGIN: "false"
    ports:
      - "61616:61616"   # core/JMS
      - "8161:8161"     # web console http://localhost:8161
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/61616'"]
      interval: 5s
      timeout: 3s
      retries: 30

  identity-service:
    <<: *service
    build: { context: ../.., dockerfile: deploy/compose/Dockerfile, args: { MODULE: identity-service } }
    image: doserunner/identity-service:dev
    environment:
      <<: *service-env
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity
      SPRING_DATASOURCE_USERNAME: identity
      SPRING_DATASOURCE_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity}
    ports: ["8081:8081"]

  order-service:
    <<: *service
    build: { context: ../.., dockerfile: deploy/compose/Dockerfile, args: { MODULE: order-service } }
    image: doserunner/order-service:dev
    environment:
      <<: *service-env
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: ${ORDERS_DB_PASSWORD:-orders}
    ports: ["8082:8082"]

  dispatch-service:
    <<: *service
    build: { context: ../.., dockerfile: deploy/compose/Dockerfile, args: { MODULE: dispatch-service } }
    image: doserunner/dispatch-service:dev
    environment:
      <<: *service-env
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleet
      SPRING_DATASOURCE_USERNAME: fleet
      SPRING_DATASOURCE_PASSWORD: ${FLEET_DB_PASSWORD:-fleet}
    ports: ["8083:8083"]

  custody-service:
    <<: *service
    # FFM image: libsodium23 + libroute.so + --enable-native-access
    build: { context: ../.., dockerfile: deploy/compose/Dockerfile.native, args: { MODULE: custody-service } }
    image: doserunner/custody-service:dev
    environment:
      <<: *service-env
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/custody
      SPRING_DATASOURCE_USERNAME: custody
      SPRING_DATASOURCE_PASSWORD: ${CUSTODY_DB_PASSWORD:-custody}
      CUSTODY_SIGNING_KEY_FILE: /app/secrets/custody-ed25519.sk
    volumes:
      - custody-keys:/app/secrets   # the Ed25519 key must survive container re-creation, or old chains stop verifying
    ports: ["8084:8084"]

  # robot-sim (owner C) joins this file during days 3-7, once it consumes robot.commands.

volumes:
  pgdata:
  custody-keys:
