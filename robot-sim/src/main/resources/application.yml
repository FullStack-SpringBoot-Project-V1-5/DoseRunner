spring:
  application:
    name: robot-sim
  artemis:
    mode: native
    broker-url: ${SPRING_ARTEMIS_BROKER_URL:tcp://localhost:61616?callTimeout=2000&reconnectAttempts=0}
    user: ${SPRING_ARTEMIS_USER:artemis}
    password: ${SPRING_ARTEMIS_PASSWORD:artemis}

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,jms

sim:
  pharmacy-x: ${SIM_PHARMACY_X:0}
  pharmacy-y: ${SIM_PHARMACY_Y:0}
