spring:
  application:
    name: dispatch-service
  artemis:
    mode: native
    broker-url: ${SPRING_ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${SPRING_ARTEMIS_USER:artemis}
    password: ${SPRING_ARTEMIS_PASSWORD:artemis}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleet}
    username: ${SPRING_DATASOURCE_USERNAME:fleet}
    password: ${SPRING_DATASOURCE_PASSWORD:fleet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

doserunner:
  # I2: JWT resource server (commons/sec). Compose sets DOSERUNNER_SECURITY_JWKSURI to identity-service.
  # No REST endpoint yet: the /fleet API from the README will need a Bearer token as soon as it exists.
  security:
    jwks-uri: http://localhost:8081/.well-known/jwks.json
    public-paths:
      - /ui/**          # fleet board stays open until the UI gets its own login (team decision pending)

dispatch:
  messaging:
    pharmacy-x: ${DISPATCH_PHARMACY_X:0}
    pharmacy-y: ${DISPATCH_PHARMACY_Y:0}
    compartments:
      R-01: C1
      R-02: C1
      R-03: C1
